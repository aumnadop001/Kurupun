{% extends "base.html" %} {% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
  <h3>
    {% if is_edit %} แก้ไขข้อมูลบัญชีคุมเลขลำดับครุภัณฑ์ {% else %}
    เพิ่มข้อมูลบัญชีคุมเลขลำดับครุภัณฑ์ใหม่ {% endif %}
  </h3>
  <a href="{{ url_for('fixed_asset_list') }}" class="btn btn-secondary">
    <i class="bi bi-arrow-left"></i> กลับ
  </a>
</div>

<form method="POST" class="needs-validation" novalidate>
  <div class="card">
    <div class="card-header">
      <h5 class="card-title mb-0">ข้อมูลเลขลำดับครุภัณฑ์</h5>
    </div>

    <div class="card-body">
      <div class="row">
        <!-- เลขลำดับครุภัณฑ์ -->
        <div class="col-md-3">
          <label for="assetSequenceNo" class="form-label"
            >เลขลำดับครุภัณฑ์ <span class="text-danger">*</span></label
          >
          <input
            type="text"
            class="form-control"
            id="assetSequenceNo"
            name="assetSequenceNo"
            value="{{ record.assetSequenceNo if record else '' }}"
            placeholder="ระบุเลขลำดับครุภัณฑ์"
            required
          />
          <div class="invalid-feedback">กรุณาระบุเลขลำดับครุภัณฑ์</div>
        </div>

        <!-- ชื่อพัสดุ -->
        <div class="col-md-5">
          <label for="assetName" class="form-label"
            >ชื่อพัสดุ <span class="text-danger">*</span></label
          >
          <input
            type="text"
            class="form-control"
            id="assetName"
            name="assetName"
            value="{{ record.assetName if record else '' }}"
            placeholder="ระบุชื่อพัสดุ"
            required
          />
          <div class="invalid-feedback">กรุณาระบุชื่อพัสดุ</div>
        </div>

        <!-- หมายเลขพัสดุ -->
        <div class="col-md-4">
          <label for="assetNumber" class="form-label">หมายเลขพัสดุ</label>
          <input
            type="text"
            class="form-control"
            id="assetNumber"
            name="assetNumber"
            value="{{ record.assetNumber if record else '' }}"
            placeholder="เช่น FA-001-2568"
          />
        </div>
      </div>

      <div class="row mt-3">
        <!-- หลักฐานรับ -->
        <div class="col-md-4">
          <label for="receiveEvidence" class="form-label"
            >หลักฐานรับ <span class="text-danger">*</span></label
          >
          <input
            type="text"
            class="form-control"
            id="receiveEvidence"
            name="receiveEvidence"
            value="{{ record.receiveEvidence if record else '' }}"
            placeholder="เช่น ใบรับของ, หนังสือรับ"
            required
          />
          <div class="invalid-feedback">กรุณาระบุหลักฐานรับ</div>
        </div>

        <!-- จ่ายให้ -->
        <div class="col-md-4">
          <label for="issuedTo" class="form-label">จ่ายให้หน่วย/บุคคล</label>
          <input
            type="text"
            class="form-control"
            id="issuedTo"
            name="issuedTo"
            value="{{ record.issuedTo if record else '' }}"
            placeholder="เช่น หน่วยงาน ก หรือ นายสมชาย"
          />
        </div>

        <!-- หลักฐานจ่าย -->
        <div class="col-md-4">
          <label for="issueEvidence" class="form-label">หลักฐานจ่าย</label>
          <input
            type="text"
            class="form-control"
            id="issueEvidence"
            name="issueEvidence"
            value="{{ record.issueEvidence if record else '' }}"
            placeholder="เช่น ใบเบิกของ, หนังสือโอน"
          />
        </div>
      </div>

      <div class="row mt-3">
        <!-- หมายเหตุ -->
        <div class="col-md-12">
          <label for="remark" class="form-label">หมายเหตุ</label>
          <textarea
            class="form-control"
            id="remark"
            name="remark"
            rows="2"
            placeholder="ระบุหมายเหตุเพิ่มเติม"
          >
{{ record.remark if record else '' }}</textarea
          >
        </div>
      </div>
    </div>

    <div class="card-footer">
      <div class="d-flex justify-content-end gap-2">
        <a href="{{ url_for('fixed_asset_list') }}" class="btn btn-secondary"
          >ยกเลิก</a
        >
        <button type="submit" class="btn btn-primary">
          {% if is_edit %} อัปเดตข้อมูล {% else %} บันทึกข้อมูล {% endif %}
        </button>
      </div>
    </div>
  </div>
</form>

<script>
  // Bootstrap form validation
  (function () {
    "use strict";
    window.addEventListener(
      "load",
      function () {
        var forms = document.getElementsByClassName("needs-validation");
        Array.prototype.forEach.call(forms, function (form) {
          form.addEventListener(
            "submit",
            function (event) {
              if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
              }
              form.classList.add("was-validated");
            },
            false
          );
        });
      },
      false
    );
  })();
</script>

{% endblock %}
