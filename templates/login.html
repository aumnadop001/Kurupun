{% extends "base.html" %} {% block content %}
<div class="text-center mt-5">
  <!-- ปุ่มเรียก Modal -->
  <button
    type="button"
    class="btn btn-primary btn-lg"
    data-bs-toggle="modal"
    data-bs-target="#loginModal"
  >
    <i class="fas fa-sign-in-alt me-2"></i> เข้าสู่ระบบ
  </button>
</div>

<!-- Modal -->
<div
  class="modal fade"
  id="loginModal"
  tabindex="-1"
  aria-labelledby="loginModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow-lg border-0">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="loginModalLabel">
          <i class="fas fa-user-lock me-2"></i> เข้าสู่ระบบ
        </h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="modal"
          aria-label="ปิด"
        ></button>
      </div>

      <div class="modal-body">
        <p class="text-muted text-center">กรุณาใส่ชื่อผู้ใช้และรหัสผ่าน</p>

        {% if error %}
        <div class="alert alert-danger" role="alert">
          <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
        </div>
        {% endif %}

        <form method="post">
          <div class="mb-3">
            <label for="username" class="form-label">
              <i class="fas fa-user me-1"></i> ชื่อผู้ใช้
            </label>
            <input
              class="form-control"
              type="text"
              id="username"
              name="username"
              placeholder="กรอกชื่อผู้ใช้"
              required
              autocomplete="username"
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">
              <i class="fas fa-lock me-1"></i> รหัสผ่าน
            </label>
            <input
              class="form-control"
              type="password"
              id="password"
              name="password"
              placeholder="กรอกรหัสผ่าน"
              required
              autocomplete="current-password"
            />
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="fas fa-sign-in-alt me-2"></i> เข้าสู่ระบบ
            </button>
          </div>
        </form>
      </div>

      <div class="modal-footer justify-content-center">
        <p class="text-muted mb-0">ยังไม่มีบัญชี?</p>
        <a
          href="{{ url_for('register') }}"
          class="btn btn-outline-success ms-2"
        >
          <i class="fas fa-user-plus me-2"></i> ลงทะเบียน
        </a>
      </div>
    </div>
  </div>
</div>

<style>
  .modal-content {
    border-radius: 15px;
  }

  .form-control {
    border-radius: 10px;
    padding: 12px;
  }

  .btn {
    border-radius: 10px;
    padding: 12px;
  }
</style>
{% endblock %}
