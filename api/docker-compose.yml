version: '3.8'

services:
  backend:
    build: .
    container_name: kurupun-service
    image: python:3.12-slim
    command: bash -c "
      cp .env.dev .env &&
      python manage.py migrate &&
      python manage.py shell -c 'import os; from django.contrib.auth import get_user_model; User = get_user_model(); 
      User.objects.filter(username=os.environ.get(\"DJANGO_SUPERUSER_USERNAME\")).exists() or 
      User.objects.create_superuser(os.environ[\"DJANGO_SUPERUSER_USERNAME\"], os.environ[\"DJANGO_SUPERUSER_EMAIL\"], os.environ[\"DJANGO_SUPERUSER_PASSWORD\"])' &&
      python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/usr/src/app
    ports:
      - "8000:8000"
    networks:
      - kurupun-networks

networks:
  kurupun-networks:
    driver: bridge
    name: kurupun-networks