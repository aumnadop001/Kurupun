{% load static %}
<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ระบบควบคุมทรัพย์สิน วิทยาลัยอาชีวศึกษานครปฐม{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'themes/theme.css' %}">
  <!-- Bootstrap CSS -->
  <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <!-- Bootstrap JS -->
  <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <!-- SweetAlert2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">

  {% block extra_css %}{% endblock %}

  <style>
    /* Responsive adjustments */
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
    }

    .navbar-brand {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
    }

    .container {
      padding-left: 15px;
      padding-right: 15px;
    }

    @media (max-width: 576px) {
      .navbar-nav {
        text-align: center;
      }

      main.container {
        padding-left: 10px;
        padding-right: 10px;
      }

      footer p {
        font-size: 0.875rem;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid container-lg">
      <a class="navbar-brand" href="{% url 'login' %}">My Site</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'document_register' %}">document_register</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid container-lg my-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-light text-center py-3 mt-auto">
    <div class="container">
      <p class="mb-0">&copy; 2025 ระบบควบคุมทรัพย์สิน วิทยาลัยอาชีวศึกษานครปฐม</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- SweetAlert2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  {% block extra_js %}{% endblock %}
</body>

</html>
