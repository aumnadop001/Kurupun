version: '3.8'

services:
  backend:
    build: .
    container_name: kurupun-service
    command: bash -c "cp .env.dev .env && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/usr/src/app
    ports:
      - "8000:8000"
    networks:
      - kurupun-networks

networks:
  kurupun-networks:
    driver: bridge
    name: kurupun-networks